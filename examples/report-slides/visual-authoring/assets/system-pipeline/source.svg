<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="675"
     viewBox="0 0 1200 675"
     role="img"
     aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Training pipeline architecture</title>
  <desc id="diagram-description">A linear baseline pipeline from source data through feature processing, model training, evaluation, and publishing.</desc>

  <rect id="canvas-background" x="0" y="0" width="1200" height="675" fill="#F7FAFC"/>

  <text id="diagram-kicker"
        x="48"
        y="48"
        fill="#5B7890"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="700"
        letter-spacing="2">REFERENCE ARCHITECTURE • BASELINE</text>
  <text id="diagram-heading"
        x="48"
        y="82"
        fill="#15334A"
        font-family="Arial, Helvetica, sans-serif"
        font-size="30"
        font-weight="700">Training pipeline architecture</text>
  <text id="diagram-subtitle"
        x="48"
        y="111"
        fill="#5B7890"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">Data moves through a controlled sequence of native, editable stages.</text>
