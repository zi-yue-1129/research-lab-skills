<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="675"
     viewBox="0 0 1200 675"
     role="img"
     aria-labelledby="accuracy-title accuracy-description">
  <title id="accuracy-title">Accuracy comparison</title>
  <desc id="accuracy-description">Editable bar chart comparing four accuracy percentages from a deterministic data file.</desc>

  <rect id="accuracy-canvas-background"
        x="0"
        y="0"
        width="1200"
        height="675"
        fill="#ffffff"/>

  <text id="accuracy-kicker"
        data-style-role="footnote"
        x="48"
        y="64"
        fill="#64748b"
        font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
        font-size="12"
        font-weight="400"
        letter-spacing="2">DETERMINISTIC DATA VIEW</text>
  <text id="accuracy-heading"
        data-style-role="slide.title"
        x="48"
        y="104"
        fill="#1e3a5f"
        font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
        font-size="32"
        font-weight="700">Accuracy comparison</text>
  <text id="accuracy-subtitle"
        data-style-role="caption"
        x="48"
        y="136"
        fill="#374151"
        font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
        font-size="16"
        font-weight="400">Four checkpoints rendered directly from data.json.</text>
  <path id="accuracy-header-rule"
        d="M48 160 H1152"
        fill="none"
        stroke="#e2e8f0"
        stroke-width="2"/>

  <g id="chart-legend"
     data-region="chart-legend"
     role="group"
     aria-label="Chart legend">
    <rect id="legend-baseline-swatch" x="856" y="88" width="16" height="16" rx="0" fill="#1e3a5f"/>
    <text id="legend-baseline-label"
          data-style-role="caption"
          x="880"
          y="101"
          fill="#374151"
          font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
          font-size="16">Baseline</text>
    <rect id="legend-current-swatch" x="976" y="88" width="16" height="16" rx="0" fill="#0f766e"/>
    <text id="legend-current-label"
          data-style-role="caption"
          x="1000"
          y="101"
          fill="#374151"
          font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
          font-size="16">Current</text>
  </g>

  <g id="chart-plot"
     data-region="chart-plot"
     data-source="data.json"
     role="group"
     aria-label="Accuracy bar chart">
    <g id="chart-grid"
       data-region="chart-grid"
       role="group"
       aria-label="Chart grid">
      <line id="grid-100" x1="136" y1="200" x2="1128" y2="200" stroke="#e2e8f0" stroke-width="1.5"/>
      <line id="grid-75" x1="136" y1="280" x2="1128" y2="280" stroke="#e2e8f0" stroke-width="1.5"/>
      <line id="grid-50" x1="136" y1="360" x2="1128" y2="360" stroke="#e2e8f0" stroke-width="1.5"/>
      <line id="grid-25" x1="136" y1="440" x2="1128" y2="440" stroke="#e2e8f0" stroke-width="1.5"/>
    </g>

    <g id="chart-axis"
       data-region="chart-axis"
       role="group"
       aria-label="Chart axes and labels">
      <line id="accuracy-y-axis" x1="136" y1="200" x2="136" y2="520" stroke="#475569" stroke-width="2"/>
      <line id="accuracy-x-axis" x1="136" y1="520" x2="1128" y2="520" stroke="#475569" stroke-width="2"/>
      <line id="accuracy-tick-100" x1="128" y1="200" x2="136" y2="200" stroke="#475569" stroke-width="2"/>
      <line id="accuracy-tick-75" x1="128" y1="280" x2="136" y2="280" stroke="#475569" stroke-width="2"/>
      <line id="accuracy-tick-50" x1="128" y1="360" x2="136" y2="360" stroke="#475569" stroke-width="2"/>
      <line id="accuracy-tick-25" x1="128" y1="440" x2="136" y2="440" stroke="#475569" stroke-width="2"/>
      <line id="accuracy-tick-0" x1="128" y1="520" x2="136" y2="520" stroke="#475569" stroke-width="2"/>
      <text id="accuracy-y-label-100" data-style-role="axis" x="112" y="206" text-anchor="end" fill="#374151" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16">100</text>
      <text id="accuracy-y-label-75" data-style-role="axis" x="112" y="286" text-anchor="end" fill="#374151" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16">75</text>
      <text id="accuracy-y-label-50" data-style-role="axis" x="112" y="366" text-anchor="end" fill="#374151" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16">50</text>
      <text id="accuracy-y-label-25" data-style-role="axis" x="112" y="446" text-anchor="end" fill="#374151" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16">25</text>
      <text id="accuracy-y-label-0" data-style-role="axis" x="112" y="526" text-anchor="end" fill="#374151" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16">0</text>
      <text id="accuracy-y-axis-title" data-style-role="footnote" x="136" y="184" fill="#64748b" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" letter-spacing="1.1">ACCURACY (%)</text>
      <text id="accuracy-x-axis-title" data-style-role="footnote" x="632" y="584" text-anchor="middle" fill="#64748b" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" letter-spacing="1.1">CHECKPOINT</text>
    </g>

    <g id="chart-bars"
       data-region="chart-bars"
       data-element="editable-bars"
       role="group"
       aria-label="Accuracy bars">
      <rect id="bar-baseline-a" data-style-role="chart.bar" data-category="Baseline A" x="176" y="289.28" width="160" height="230.72" fill="#1e3a5f"/>
      <rect id="bar-baseline-b" data-style-role="chart.bar" data-category="Baseline B" x="424" y="258.88" width="160" height="261.12" fill="#1e3a5f"/>
      <rect id="bar-current-a" data-style-role="chart.bar" data-category="Current A" x="672" y="205.12" width="160" height="314.88" fill="#0f766e"/>
      <rect id="bar-current-b" data-style-role="chart.bar" data-category="Current B" x="920" y="200" width="160" height="320" fill="#0f766e"/>

      <text id="bar-baseline-a-value" data-style-role="node.label" x="256" y="277" text-anchor="middle" fill="#1e3a5f" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="18" font-weight="600">72.1%</text>
      <text id="bar-baseline-b-value" data-style-role="node.label" x="504" y="247" text-anchor="middle" fill="#1e3a5f" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="18" font-weight="600">81.6%</text>
      <text id="bar-current-a-value" data-style-role="node.label" x="752" y="193" text-anchor="middle" fill="#0f766e" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="18" font-weight="600">98.4%</text>
      <text id="bar-current-b-value" data-style-role="node.label" x="1000" y="188" text-anchor="middle" fill="#0f766e" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="18" font-weight="600">100.0%</text>

      <text id="bar-baseline-a-label" data-style-role="axis" x="256" y="552" text-anchor="middle" fill="#374151" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16">Baseline A</text>
      <text id="bar-baseline-b-label" data-style-role="axis" x="504" y="552" text-anchor="middle" fill="#374151" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16">Baseline B</text>
      <text id="bar-current-a-label" data-style-role="axis" x="752" y="552" text-anchor="middle" fill="#374151" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16">Current A</text>
      <text id="bar-current-b-label" data-style-role="axis" x="1000" y="552" text-anchor="middle" fill="#374151" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif" font-size="16">Current B</text>
    </g>
  </g>

  <path id="accuracy-footer-rule" d="M48 608 H1152" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <text id="accuracy-footer-note"
        data-style-role="footnote"
        x="48"
        y="632"
        fill="#64748b"
        font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
        font-size="12">Source data: accuracy-comparison/data.json • unit: percent</text>
</svg>
