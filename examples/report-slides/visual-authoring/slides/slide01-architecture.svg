<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="675"
     viewBox="0 0 1200 675"
     role="img"
     aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Training pipeline architecture</title>
  <desc id="diagram-description">A linear baseline pipeline from source data through feature processing, model training, evaluation, and publishing, with a human review gate that can return a run to training.</desc>

  <defs>
    <marker id="pipeline-arrowhead"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto-start-reverse"
            markerUnits="strokeWidth">
      <path d="M0 1 L9 5 L0 9 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect id="canvas-background"
        x="0"
        y="0"
        width="1200"
        height="675"
        fill="#ffffff"/>

  <text id="diagram-kicker"
        data-style-role="footnote"
        x="48"
        y="64"
        fill="#64748b"
        font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
        font-size="12"
        letter-spacing="1.8">REFERENCE ARCHITECTURE • BASELINE</text>
  <text id="diagram-heading"
        data-style-role="slide.title"
        x="48"
        y="104"
        fill="#1e3a5f"
        font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
        font-size="32"
        font-weight="700">Training pipeline architecture</text>
  <text id="diagram-subtitle"
        data-style-role="caption"
        x="48"
        y="136"
        fill="#374151"
        font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
        font-size="16">Data moves through a controlled sequence of native, editable stages.</text>
  <path id="header-rule"
        d="M48 160 H1152"
        fill="none"
        stroke="#e2e8f0"
        stroke-width="2"/>

  <text id="flow-label"
        data-style-role="footnote"
        x="48"
        y="192"
        fill="#64748b"
        font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
        font-size="12"
        letter-spacing="1.6">DIRECTED DATA FLOW</text>

  <g id="pipeline-stages"
     data-region="pipeline-stages"
     role="group"
     aria-label="The five pipeline stages">

    <g id="ingestion" data-node-id="ingestion">
      <rect id="ingestion-card" x="48" y="216" width="200" height="216" rx="8"
            fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <text id="ingestion-step" data-style-role="footnote" x="72" y="248"
            fill="#64748b"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="12" letter-spacing="1.2">01</text>
      <text id="ingestion-title" data-style-role="node.label" x="72" y="288"
            fill="#1e3a5f"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="18" font-weight="600"><tspan x="72" dy="0">Data</tspan><tspan x="72" dy="24">sources</tspan></text>
      <text id="ingestion-detail" data-style-role="caption" x="72" y="344"
            fill="#374151"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="16"><tspan x="72" dy="0">Raw inputs</tspan><tspan x="72" dy="20">and metadata</tspan></text>
      <text id="ingestion-output" data-style-role="footnote" x="72" y="408"
            fill="#64748b"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="12">OUTPUT: DATASET</text>
    </g>

    <g id="feature-processing" data-node-id="feature-processing">
      <rect id="feature-processing-card" x="272" y="216" width="200" height="216" rx="8"
            fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <text id="feature-processing-step" data-style-role="footnote" x="296" y="248"
            fill="#64748b"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="12" letter-spacing="1.2">02</text>
      <text id="feature-processing-title" data-style-role="node.label" x="296" y="288"
            fill="#1e3a5f"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="18" font-weight="600"><tspan x="296" dy="0">Feature</tspan><tspan x="296" dy="24">processing</tspan></text>
      <text id="feature-processing-detail" data-style-role="caption" x="296" y="344"
            fill="#374151"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="16"><tspan x="296" dy="0">Normalize,</tspan><tspan x="296" dy="20">encode, split</tspan></text>
      <text id="feature-processing-output" data-style-role="footnote" x="296" y="408"
            fill="#64748b"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="12">OUTPUT: FEATURES</text>
    </g>

    <g id="training" data-node-id="training">
      <rect id="training-card" x="496" y="216" width="200" height="216" rx="8"
            fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <text id="training-step" data-style-role="footnote" x="520" y="248"
            fill="#64748b"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="12" letter-spacing="1.2">03</text>
      <text id="training-title" data-style-role="node.label" x="520" y="288"
            fill="#1e3a5f"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="18" font-weight="600"><tspan x="520" dy="0">Model</tspan><tspan x="520" dy="24">training</tspan></text>
      <text id="training-detail" data-style-role="caption" x="520" y="344"
            fill="#374151"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="16"><tspan x="520" dy="0">Fit model</tspan><tspan x="520" dy="20">parameters</tspan></text>
      <text id="training-output" data-style-role="footnote" x="520" y="408"
            fill="#64748b"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="12">OUTPUT: MODEL</text>
    </g>

    <g id="evaluation" data-node-id="evaluation">
      <rect id="evaluation-card" x="720" y="216" width="200" height="216" rx="8"
            fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <text id="evaluation-step" data-style-role="footnote" x="744" y="248"
            fill="#64748b"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="12" letter-spacing="1.2">04</text>
      <text id="evaluation-title" data-style-role="node.label" x="744" y="288"
            fill="#1e3a5f"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="18" font-weight="600"><tspan x="744" dy="0">Evaluation</tspan><tspan x="744" dy="24">stage</tspan></text>
      <text id="evaluation-detail" data-style-role="caption" x="744" y="344"
            fill="#374151"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="16"><tspan x="744" dy="0">Holdout</tspan><tspan x="744" dy="20">metrics</tspan></text>
      <text id="evaluation-output" data-style-role="footnote" x="744" y="408"
            fill="#64748b"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="12">OUTPUT: METRICS</text>
    </g>

    <g id="publishing" data-node-id="publishing">
      <rect id="publishing-card" x="944" y="216" width="200" height="216" rx="8"
            fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <text id="publishing-step" data-style-role="footnote" x="968" y="248"
            fill="#64748b"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="12" letter-spacing="1.2">05</text>
      <text id="publishing-title" data-style-role="node.label" x="968" y="288"
            fill="#1e3a5f"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="18" font-weight="600"><tspan x="968" dy="0">Model</tspan><tspan x="968" dy="24">publishing</tspan></text>
      <text id="publishing-detail" data-style-role="caption" x="968" y="344"
            fill="#374151"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="16"><tspan x="968" dy="0">Versioned</tspan><tspan x="968" dy="20">artifact</tspan></text>
      <text id="publishing-output" data-style-role="footnote" x="968" y="408"
            fill="#64748b"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="12">OUTPUT: ARTIFACT</text>
    </g>
  </g>

  <g id="connector-layer"
     data-region="connector-layer"
     role="group"
     aria-label="Forward data connectors">
    <line id="connector-ingestion-feature-processing"
          data-from="ingestion" data-to="feature-processing"
          x1="248" y1="324" x2="272" y2="324"
          stroke="#475569" stroke-width="2"
          marker-end="url(#pipeline-arrowhead)"/>
    <line id="connector-feature-processing-training"
          data-from="feature-processing" data-to="training"
          x1="472" y1="324" x2="496" y2="324"
          stroke="#475569" stroke-width="2"
          marker-end="url(#pipeline-arrowhead)"/>
    <line id="connector-training-evaluation"
          data-from="training" data-to="evaluation"
          x1="696" y1="324" x2="720" y2="324"
          stroke="#475569" stroke-width="2"
          marker-end="url(#pipeline-arrowhead)"/>
    <line id="connector-evaluation-publishing"
          data-from="evaluation" data-to="publishing"
          x1="920" y1="324" x2="944" y2="324"
          stroke="#475569" stroke-width="2"
          marker-end="url(#pipeline-arrowhead)"/>
  </g>

  <g id="human-review-branch"
     data-region="human-review-branch"
     role="group"
     aria-label="The human review gate">
    <g id="human-review" data-node-id="human-review">
      <rect id="human-review-card" x="608" y="488" width="384" height="104" rx="8"
            fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <text id="human-review-title" data-style-role="node.label" x="632" y="528"
            fill="#1e3a5f"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="18" font-weight="600">HUMAN REVIEW</text>
      <text id="human-review-detail" data-style-role="caption" x="632" y="560"
            fill="#374151"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="16">Approve the run, or return it to training.</text>
    </g>

    <line id="connector-evaluation-human-review"
          data-from="evaluation" data-to="human-review"
          x1="820" y1="432" x2="820" y2="488"
          stroke="#475569" stroke-width="2"
          marker-end="url(#pipeline-arrowhead)"/>
    <line id="connector-human-review-publishing"
          data-from="human-review" data-to="publishing"
          x1="992" y1="512" x2="1044" y2="432"
          stroke="#475569" stroke-width="2"
          marker-end="url(#pipeline-arrowhead)"/>
    <line id="connector-human-review-training"
          data-from="human-review" data-to="training"
          x1="608" y1="512" x2="596" y2="432"
          stroke="#475569" stroke-width="2"
          marker-end="url(#pipeline-arrowhead)"/>

    <text id="human-approval-label" data-style-role="footnote" x="1056" y="472"
          fill="#64748b"
          font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
          font-size="12" letter-spacing="1.2">APPROVE</text>
    <text id="human-return-label" data-style-role="footnote" x="456" y="472"
          fill="#64748b"
          font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
          font-size="12" letter-spacing="1.2" text-anchor="end">RETURN FOR RE-RUN</text>
  </g>

  <path id="footer-rule"
        d="M48 616 H1152"
        fill="none"
        stroke="#e2e8f0"
        stroke-width="1.5"/>
  <text id="footer-note"
        data-style-role="footnote"
        x="48"
        y="632"
        fill="#64748b"
        font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
        font-size="12">Baseline scope: five bounded stages with explicit forward handoffs, and one human gate that can return a run.</text>
</svg>
