<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="675"
     viewBox="0 0 1200 675"
     role="img"
     aria-labelledby="collaboration-title collaboration-description">
  <title id="collaboration-title">Researcher and AI collaboration loop</title>
  <desc id="collaboration-description">An illustrative raster base with editable callouts for a researcher and AI collaboration loop.</desc>

  <image id="generated-raster-background"
         data-layer="raster"
         data-content="illustration-only"
         href="../assets/research-collaboration/generated.png"
         x="0"
         y="0"
         width="1200"
         height="675"
         preserveAspectRatio="xMidYMid slice"/>

  <g id="editable-overlay"
     data-layer="editable-overlay"
     role="group"
     aria-label="Editable factual overlay">
    <g id="collaboration-header"
       data-region="collaboration-header"
       role="group"
       aria-labelledby="collaboration-header-title">
      <rect id="collaboration-header-panel"
            x="44"
            y="38"
            width="454"
            height="104"
            rx="16"
            fill="#0D2B40"
            fill-opacity="0.92"/>
      <rect id="collaboration-header-accent"
            x="44"
            y="38"
            width="7"
            height="104"
            rx="3.5"
            fill="#DDA45E"/>
      <text id="collaboration-header-kicker"
            x="70"
            y="70"
            fill="#B8DDE2"
            font-family="Arial, Helvetica, sans-serif"
            font-size="12"
            font-weight="700"
            letter-spacing="1.8">RESEARCH COLLABORATION</text>
      <text id="collaboration-header-title"
            x="70"
            y="105"
            fill="#FFFFFF"
            font-family="Arial, Helvetica, sans-serif"
            font-size="26"
            font-weight="700">Researcher + AI loop</text>
      <text id="collaboration-header-subtitle"
            x="70"
            y="128"
            fill="#D5E4EA"
            font-family="Arial, Helvetica, sans-serif"
            font-size="13">Editable annotations sit above the illustrative base.</text>
    </g>

    <rect id="collaboration-loop-panel"
          data-element="editable-panel"
          x="44"
          y="485"
          width="1112"
          height="142"
          rx="18"
          fill="#FFFFFF"
          fill-opacity="0.91"
          stroke="#D9E5EC"
          stroke-width="2"/>

    <g id="researcher-zone"
       data-region="researcher-zone"
       role="group"
       aria-labelledby="researcher-zone-title">
      <rect id="researcher-zone-callout"
            x="72"
            y="518"
            width="218"
            height="58"
            rx="10"
            fill="#F7FBFC"
            stroke="#4F86A3"
            stroke-width="2"/>
      <circle id="researcher-zone-marker"
              cx="94"
              cy="547"
              r="9"
              fill="#DDA45E"/>
      <path id="researcher-zone-marker-icon"
            d="M90 547 A4 4 0 1 1 98 547 M88 555 C90 551 98 551 100 555"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="1.5"
            stroke-linecap="round"/>
      <text id="researcher-zone-title"
            x="112"
            y="543"
            fill="#15334A"
            font-family="Arial, Helvetica, sans-serif"
            font-size="12"
            font-weight="700"
            letter-spacing="1.2">RESEARCHER</text>
      <text id="researcher-zone-detail"
            x="112"
            y="562"
            fill="#557085"
            font-family="Arial, Helvetica, sans-serif"
            font-size="12">Frames the question</text>
    </g>

    <g id="ai-lab-zone"
       data-region="ai-lab-zone"
       role="group"
       aria-labelledby="ai-lab-zone-title">
      <rect id="ai-lab-zone-callout"
            x="894"
            y="518"
            width="218"
            height="58"
            rx="10"
            fill="#F7FBFC"
            stroke="#4F9A9A"
            stroke-width="2"/>
      <circle id="ai-lab-zone-marker"
              cx="916"
              cy="547"
              r="9"
              fill="#4F9A9A"/>
      <path id="ai-lab-zone-marker-icon"
            d="M911 547 H921 M916 542 V552 M912 543 L920 551 M920 543 L912 551"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="1.5"
            stroke-linecap="round"/>
      <text id="ai-lab-zone-title"
            x="934"
            y="543"
            fill="#15334A"
            font-family="Arial, Helvetica, sans-serif"
            font-size="12"
            font-weight="700"
            letter-spacing="1.2">AI LAB</text>
      <text id="ai-lab-zone-detail"
            x="934"
            y="562"
            fill="#557085"
            font-family="Arial, Helvetica, sans-serif"
            font-size="12">Surfaces patterns</text>
    </g>

    <g id="collaboration-loop"
       data-region="collaboration-loop"
       data-element="editable-callout-loop"
       role="group"
       aria-label="Editable collaboration loop">
      <text id="collaboration-loop-label"
            x="72"
            y="510"
            fill="#6E899D"
            font-family="Arial, Helvetica, sans-serif"
            font-size="10"
            font-weight="700"
            letter-spacing="1.8">EDITABLE COLLABORATION LOOP</text>

      <rect id="collaboration-step-question"
            x="310"
            y="518"
            width="132"
            height="58"
            rx="10"
            fill="#EEF5F8"
            stroke="#B9CCD9"
            stroke-width="1.5"/>
      <text id="collaboration-step-question-label"
            x="376"
            y="543"
            text-anchor="middle"
            fill="#15334A"
            font-family="Arial, Helvetica, sans-serif"
            font-size="11"
            font-weight="700"
            letter-spacing="1">QUESTION</text>
      <text id="collaboration-step-question-detail"
            x="376"
            y="562"
            text-anchor="middle"
            fill="#557085"
            font-family="Arial, Helvetica, sans-serif"
            font-size="11">frame</text>

      <rect id="collaboration-step-experiment"
            x="466"
            y="518"
            width="132"
            height="58"
            rx="10"
            fill="#EEF7F7"
            stroke="#B9CCD9"
            stroke-width="1.5"/>
      <text id="collaboration-step-experiment-label"
            x="532"
            y="543"
            text-anchor="middle"
            fill="#15334A"
            font-family="Arial, Helvetica, sans-serif"
            font-size="11"
            font-weight="700"
            letter-spacing="1">EXPERIMENT</text>
      <text id="collaboration-step-experiment-detail"
            x="532"
            y="562"
            text-anchor="middle"
            fill="#557085"
            font-family="Arial, Helvetica, sans-serif"
            font-size="11">probe</text>

      <rect id="collaboration-step-judgment"
            x="622"
            y="518"
            width="132"
            height="58"
            rx="10"
            fill="#FBF5EC"
            stroke="#D7BB91"
            stroke-width="1.5"/>
      <text id="collaboration-step-judgment-label"
            x="688"
            y="543"
            text-anchor="middle"
            fill="#15334A"
            font-family="Arial, Helvetica, sans-serif"
            font-size="11"
            font-weight="700"
            letter-spacing="1">JUDGMENT</text>
      <text id="collaboration-step-judgment-detail"
            x="688"
            y="562"
            text-anchor="middle"
            fill="#8B6840"
            font-family="Arial, Helvetica, sans-serif"
            font-size="11">review</text>

      <path id="collaboration-loop-arrow-question"
            data-element="loop-arrow"
            d="M442 547 H458"
            fill="none"
            stroke="#6B9AB2"
            stroke-width="2.5"
            stroke-linecap="round"/>
      <path id="collaboration-loop-arrow-question-head"
            d="M452 541 L460 547 L452 553"
            fill="none"
            stroke="#6B9AB2"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"/>
      <path id="collaboration-loop-arrow-experiment"
            data-element="loop-arrow"
            d="M598 547 H614"
            fill="none"
            stroke="#6B9AB2"
            stroke-width="2.5"
            stroke-linecap="round"/>
      <path id="collaboration-loop-arrow-experiment-head"
            d="M608 541 L616 547 L608 553"
            fill="none"
            stroke="#6B9AB2"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"/>
      <path id="collaboration-loop-return"
            data-element="loop-return"
            d="M754 590 C620 617 448 617 290 590"
            fill="none"
            stroke="#4F9A9A"
            stroke-width="2.5"
            stroke-linecap="round"/>
      <path id="collaboration-loop-return-head"
            d="M300 584 L288 590 L300 596"
            fill="none"
            stroke="#4F9A9A"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <g id="disclosure-footer"
       data-region="disclosure-footer"
       role="group"
       aria-label="Illustration disclosure">
      <text id="disclosure-footer-text"
            x="72"
            y="610"
            fill="#7892A4"
            font-family="Arial, Helvetica, sans-serif"
            font-size="10">Illustrative AI-generated base only • factual callouts remain editable overlays</text>
    </g>
  </g>
</svg>
