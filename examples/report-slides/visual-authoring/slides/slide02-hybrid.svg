<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="675"
     viewBox="0 0 1200 675"
     role="img"
     aria-labelledby="collaboration-title collaboration-description">
  <title id="collaboration-title">Researcher and AI collaboration loop</title>
  <desc id="collaboration-description">A deterministic diagram of the researcher and AI collaboration loop: two actors above, and a three-stage cycle of question, experiment, and judgment below.</desc>

  <defs>
    <marker id="collaboration-arrowhead"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto-start-reverse"
            markerUnits="strokeWidth">
      <path d="M0 1 L9 5 L0 9 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect id="collaboration-canvas-background"
        x="0"
        y="0"
        width="1200"
        height="675"
        fill="#ffffff"/>

  <text id="collaboration-kicker"
        data-style-role="footnote"
        x="48"
        y="64"
        fill="#64748b"
        font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
        font-size="12"
        letter-spacing="1.8">RESEARCH COLLABORATION</text>
  <text id="collaboration-heading"
        data-style-role="slide.title"
        x="48"
        y="104"
        fill="#1e3a5f"
        font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
        font-size="32"
        font-weight="700">Researcher + AI loop</text>
  <text id="collaboration-subtitle"
        data-style-role="caption"
        x="48"
        y="136"
        fill="#374151"
        font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
        font-size="16">Every mark on this slide is editable vector geometry.</text>
  <path id="collaboration-header-rule"
        d="M48 160 H1152"
        fill="none"
        stroke="#e2e8f0"
        stroke-width="2"/>

  <g id="collaboration-actors"
     data-region="collaboration-actors"
     role="group"
     aria-label="The two actors in the loop">
    <g id="researcher" data-node-id="researcher">
      <rect id="researcher-card"
            x="48"
            y="192"
            width="528"
            height="104"
            rx="8"
            fill="#f8fafc"
            stroke="#e2e8f0"
            stroke-width="1.5"/>
      <text id="researcher-title"
            data-style-role="node.label"
            x="72"
            y="232"
            fill="#1e3a5f"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="18"
            font-weight="600">RESEARCHER</text>
      <text id="researcher-detail"
            data-style-role="caption"
            x="72"
            y="264"
            fill="#374151"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="16">Frames the question and judges the evidence.</text>
    </g>
    <g id="ai-lab" data-node-id="ai-lab">
      <rect id="ai-lab-card"
            x="624"
            y="192"
            width="528"
            height="104"
            rx="8"
            fill="#f8fafc"
            stroke="#e2e8f0"
            stroke-width="1.5"/>
      <text id="ai-lab-title"
            data-style-role="node.label"
            x="648"
            y="232"
            fill="#1e3a5f"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="18"
            font-weight="600">AI LAB</text>
      <text id="ai-lab-detail"
            data-style-role="caption"
            x="648"
            y="264"
            fill="#374151"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="16">Surfaces patterns and proposes experiments.</text>
    </g>
  </g>

  <text id="collaboration-loop-label"
        data-style-role="footnote"
        x="48"
        y="328"
        fill="#64748b"
        font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
        font-size="12"
        letter-spacing="1.6">EDITABLE COLLABORATION LOOP</text>

  <g id="collaboration-loop"
     data-region="collaboration-loop"
     role="group"
     aria-label="The three-stage collaboration cycle">
    <g id="stage-question" data-node-id="stage-question">
      <rect id="stage-question-card"
            x="48"
            y="344"
            width="304"
            height="112"
            rx="8"
            fill="#f8fafc"
            stroke="#e2e8f0"
            stroke-width="1.5"/>
      <text id="stage-question-title"
            data-style-role="node.label"
            x="72"
            y="384"
            fill="#1e3a5f"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="18"
            font-weight="600">QUESTION</text>
      <text id="stage-question-detail"
            data-style-role="caption"
            x="72"
            y="416"
            fill="#374151"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="16">Frame what is being asked.</text>
    </g>
    <g id="stage-experiment" data-node-id="stage-experiment">
      <rect id="stage-experiment-card"
            x="848"
            y="344"
            width="304"
            height="112"
            rx="8"
            fill="#f8fafc"
            stroke="#e2e8f0"
            stroke-width="1.5"/>
      <text id="stage-experiment-title"
            data-style-role="node.label"
            x="872"
            y="384"
            fill="#1e3a5f"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="18"
            font-weight="600">EXPERIMENT</text>
      <text id="stage-experiment-detail"
            data-style-role="caption"
            x="872"
            y="416"
            fill="#374151"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="16">Probe it against the data.</text>
    </g>
    <g id="stage-judgment" data-node-id="stage-judgment">
      <rect id="stage-judgment-card"
            x="448"
            y="488"
            width="304"
            height="112"
            rx="8"
            fill="#f8fafc"
            stroke="#e2e8f0"
            stroke-width="1.5"/>
      <text id="stage-judgment-title"
            data-style-role="node.label"
            x="472"
            y="528"
            fill="#1e3a5f"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="18"
            font-weight="600">JUDGMENT</text>
      <text id="stage-judgment-detail"
            data-style-role="caption"
            x="472"
            y="560"
            fill="#374151"
            font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
            font-size="16">Review what the probe showed.</text>
    </g>

    <line id="connector-question-experiment"
          data-from="stage-question"
          data-to="stage-experiment"
          x1="352"
          y1="400"
          x2="848"
          y2="400"
          stroke="#475569"
          stroke-width="2"
          marker-end="url(#collaboration-arrowhead)"/>
    <line id="connector-experiment-judgment"
          data-from="stage-experiment"
          data-to="stage-judgment"
          x1="1000"
          y1="456"
          x2="752"
          y2="512"
          stroke="#475569"
          stroke-width="2"
          marker-end="url(#collaboration-arrowhead)"/>
    <line id="connector-judgment-question"
          data-from="stage-judgment"
          data-to="stage-question"
          x1="448"
          y1="512"
          x2="200"
          y2="456"
          stroke="#475569"
          stroke-width="2"
          marker-end="url(#collaboration-arrowhead)"/>
  </g>

  <path id="collaboration-footer-rule"
        d="M48 616 H1152"
        fill="none"
        stroke="#e2e8f0"
        stroke-width="1.5"/>
  <text id="collaboration-footer-note"
        data-style-role="footnote"
        x="48"
        y="632"
        fill="#64748b"
        font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif"
        font-size="12">Deterministic vector diagram; the generated raster layer was downgraded out of this slide.</text>
</svg>
