    <text x="1800" y="254" font-size="16" font-weight="400" fill="#64748b">Linear d to C</text>
    <text x="1800" y="280" font-size="16" fill="#64748b">(B, C)</text>
  </g>
  <g data-pptx-role="group" data-node-id="head-loss">
