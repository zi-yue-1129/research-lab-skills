    <text x="642.2" y="274.2" font-size="18.2" font-weight="400" fill="#64748b">applied to Q and K</text>
    <text x="642.2" y="308.2" font-size="18.2" fill="#64748b">(B, L, d)</text>
  </g>
  <rect x="944" y="144" width="712" height="192" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="960" y="170" font-size="18.2" font-weight="600" fill="#64748b">2. Encoder stack  (N = 24)</text>
  <g data-pptx-role="group" data-node-id="stack-b1">
