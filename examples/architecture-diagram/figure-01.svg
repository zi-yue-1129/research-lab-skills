    <text x="1032" y="230" font-size="18" font-weight="600" fill="#374151">Block 2</text>
    <text x="1032" y="256" font-size="16" fill="#64748b">(B, L, d)</text>
  </g>
  <g data-pptx-role="group" data-node-id="stack-rep">
    <rect x="1176" y="200" width="88" height="64" fill="#ffffff" stroke="none"/>
    <text x="1220" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#64748b">• • •</text>
  </g>
  <g data-pptx-role="group" data-node-id="stack-bn">
