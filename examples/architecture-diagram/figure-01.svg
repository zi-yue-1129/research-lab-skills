    <text x="322.2" y="274.2" font-size="18.2" font-weight="400" fill="#64748b">vocab 32k, weight-tied</text>
    <text x="322.2" y="308.2" font-size="18.2" fill="#64748b">(B, L, d)</text>
  </g>
  <g data-pptx-role="group" data-node-id="in-pos">
