<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <desc>Transformer encoder — full architecture. Input pipeline, the repeated stack, both sub-blocks opened up, and the training path</desc>
  <rect x="0" y="0" width="2400" height="1350" fill="#ffffff"/>
  <text x="64" y="96" font-size="32" font-weight="700" fill="#1e3a5f">Transformer encoder — full architecture</text>
