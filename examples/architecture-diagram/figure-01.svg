    <text x="1304" y="256" font-size="16" fill="#64748b">(B, L, d)</text>
  </g>
  <rect x="1480" y="144" width="760" height="176" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="1496" y="170" font-size="16" font-weight="600" fill="#64748b">3. Head</text>
