    <text x="288" y="230" font-size="18" font-weight="600" fill="#374151">Embedding</text>
    <text x="288" y="254" font-size="16" font-weight="400" fill="#64748b">vocab 32k, weight-tied</text>
    <text x="288" y="280" font-size="16" fill="#64748b">(B, L, d)</text>
  </g>
  <g data-pptx-role="group" data-node-id="in-pos">
    <rect x="560" y="200" width="224" height="96" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="576" y="230" font-size="18" font-weight="600" fill="#374151">Rotary position</text>
    <text x="576" y="254" font-size="16" font-weight="400" fill="#64748b">applied to Q and K</text>
    <text x="576" y="280" font-size="16" fill="#64748b">(B, L, d)</text>
  </g>
  <rect x="832" y="144" width="624" height="152" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="848" y="170" font-size="16" font-weight="600" fill="#64748b">2. Encoder stack  (N = 24)</text>
  <g data-pptx-role="group" data-node-id="stack-b1">
    <rect x="856" y="200" width="136" height="72" rx="8" fill="#f8fafc" stroke="#1e3a5f" stroke-width="1.5"/>
