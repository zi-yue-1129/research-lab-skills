    <text x="1178.2" y="276.2" font-size="18.2" fill="#64748b">(B, L, d)</text>
  </g>
  <g data-pptx-role="group" data-node-id="stack-rep">
    <rect x="1344" y="216" width="96" height="72" fill="#ffffff" stroke="none"/>
    <text x="1392" y="262.2" text-anchor="middle" font-size="20.5" font-weight="700" fill="#64748b">• • •</text>
  </g>
  <g data-pptx-role="group" data-node-id="stack-bn">
