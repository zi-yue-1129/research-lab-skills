<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <desc>Transformer encoder stack. Token stream to pooled representation, with one block opened up</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#ffffff"/>
  <text x="48" y="84" font-size="32" font-weight="700" fill="#1e3a5f">Transformer encoder stack</text>
  <text x="48" y="114" font-size="16" fill="#64748b">Token stream to pooled representation, with one block opened up</text>
  <rect x="48" y="128" width="1072" height="152" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="64" y="154" font-size="16" font-weight="600" fill="#64748b">1. Forward path  (encoder stack, N=24)</text>
  <g data-pptx-role="group" data-node-id="stack-emb">
    <rect x="72" y="184" width="184" height="72" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="88" y="214" font-size="18" font-weight="600" fill="#374151">Embedding</text>
    <text x="88" y="240" font-size="16" fill="#64748b">(B,L) to (B,L,d)</text>
  </g>
  <g data-pptx-role="group" data-node-id="stack-b1">
    <rect x="280" y="184" width="136" height="72" rx="8" fill="#f8fafc" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="296" y="214" font-size="18" font-weight="600" fill="#374151">Block 1</text>
    <text x="296" y="240" font-size="16" fill="#64748b">(B,L,d)</text>
  </g>
  <text x="468" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#64748b">• • •</text>
  <g data-pptx-role="group" data-node-id="stack-bn">
    <rect x="520" y="184" width="144" height="72" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="536" y="214" font-size="18" font-weight="600" fill="#374151">Block N</text>
    <text x="536" y="240" font-size="16" fill="#64748b">(B,L,d)</text>
  </g>
  <g data-pptx-role="group" data-node-id="stack-pool">
    <rect x="688" y="184" width="168" height="72" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="704" y="214" font-size="18" font-weight="600" fill="#374151">Mean pool</text>
    <text x="704" y="240" font-size="16" fill="#64748b">(B, d)</text>
  </g>
  <g data-pptx-role="group" data-node-id="stack-loss">
    <rect x="880" y="184" width="216" height="72" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
    <text x="896" y="214" font-size="18" font-weight="600" fill="#374151">Cross-entropy</text>
    <text x="896" y="240" font-size="16" fill="#64748b">scalar</text>
  </g>
  <rect x="48" y="304" width="1064" height="256" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="64" y="330" font-size="16" font-weight="600" fill="#64748b">2. Inside one block  (pre-norm residual)</text>
  <rect x="72" y="360" width="496" height="176" rx="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="88" y="386" font-size="16" font-weight="600" fill="#64748b">Self-attention</text>
  <g data-pptx-role="group" data-node-id="blk-attn-ln1">
    <rect x="96" y="424" width="176" height="72" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="112" y="454" font-size="18" font-weight="600" fill="#374151">LayerNorm</text>
    <text x="112" y="480" font-size="16" fill="#64748b">(B,L,d)</text>
  </g>
  <g data-pptx-role="group" data-node-id="blk-attn-sdp">
    <rect x="296" y="416" width="160" height="96" rx="8" fill="#f8fafc" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="312" y="446" font-size="18" font-weight="600" fill="#374151">Attention</text>
    <text x="312" y="470" font-size="16" font-weight="400" fill="#64748b">H heads</text>
    <text x="312" y="496" font-size="16" fill="#64748b">(B,H,L,L)</text>
  </g>
  <g data-pptx-role="group" data-node-id="blk-attn-add1">
    <circle cx="512" cy="464" r="32" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="512" y="471" text-anchor="middle" font-size="18" font-weight="700" fill="#475569">+</text>
  </g>
  <rect x="592" y="368" width="496" height="152" rx="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="608" y="394" font-size="16" font-weight="600" fill="#64748b">Feed-forward</text>
  <g data-pptx-role="group" data-node-id="blk-ffn-ln2">
    <rect x="616" y="424" width="176" height="72" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="632" y="454" font-size="18" font-weight="600" fill="#374151">LayerNorm</text>
    <text x="632" y="480" font-size="16" fill="#64748b">(B,L,d)</text>
  </g>
  <g data-pptx-role="group" data-node-id="blk-ffn-up">
    <rect x="816" y="424" width="160" height="72" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="832" y="454" font-size="18" font-weight="600" fill="#374151">Linear 4d</text>
    <text x="832" y="480" font-size="16" fill="#64748b">(B,L,4d)</text>
  </g>
  <g data-pptx-role="group" data-node-id="blk-ffn-add2">
    <circle cx="1032" cy="456" r="32" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="1032" y="463" text-anchor="middle" font-size="18" font-weight="700" fill="#475569">+</text>
  </g>
  <defs><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="arrow-aux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs>
  <polyline points="256,220 280,220" fill="none" stroke="#475569" stroke-width="2" data-from="stack-emb" data-to="stack-b1" marker-end="url(#arrow-line)"/>
  <polyline points="664,220 688,220" fill="none" stroke="#475569" stroke-width="2" data-from="stack-bn" data-to="stack-pool" marker-end="url(#arrow-line)"/>
  <polyline points="856,220 880,220" fill="none" stroke="#475569" stroke-width="2" data-from="stack-pool" data-to="stack-loss" marker-end="url(#arrow-line)"/>
  <polyline points="272,460 280,460 280,464 296,464" fill="none" stroke="#475569" stroke-width="2" data-from="blk-attn-ln1" data-to="blk-attn-sdp" marker-end="url(#arrow-line)"/>
  <polyline points="456,464 480,464" fill="none" stroke="#475569" stroke-width="2" data-from="blk-attn-sdp" data-to="blk-attn-add1" marker-end="url(#arrow-line)"/>
  <polyline points="792,460 816,460" fill="none" stroke="#475569" stroke-width="2" data-from="blk-ffn-ln2" data-to="blk-ffn-up" marker-end="url(#arrow-line)"/>
  <polyline points="976,460 984,460 984,456 1000,456" fill="none" stroke="#475569" stroke-width="2" data-from="blk-ffn-up" data-to="blk-ffn-add2" marker-end="url(#arrow-line)"/>
  <polyline points="184,424 184,384 512,384 512,432" fill="none" stroke="#475569" stroke-width="2" data-from="blk-attn-ln1" data-to="blk-attn-add1" marker-end="url(#arrow-line)"/>
  <polyline points="704,424 704,384 1032,384 1032,424" fill="none" stroke="#475569" stroke-width="2" data-from="blk-ffn-ln2" data-to="blk-ffn-add2" marker-end="url(#arrow-line)"/>
  <polyline points="544,464 576,464 576,460 616,460" fill="none" stroke="#475569" stroke-width="2" data-from="blk-attn-add1" data-to="blk-ffn-ln2" marker-end="url(#arrow-line)"/>
  <polyline points="988,256 988,552 376,552 376,512" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="8 4" data-from="stack-loss" data-to="blk-attn-sdp" marker-end="url(#arrow-aux)"/>
  <text x="48" y="635" font-size="16" fill="#64748b">Amber: the training-only gradient path. Arcs are residual identities. L sequence length, d model width, H heads.</text>
</svg>
