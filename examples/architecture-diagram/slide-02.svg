<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif">
  <desc>Transformer encoder stack. Token stream to pooled representation, with one block opened up</desc>
  <rect x="0" y="0" width="1200" height="675" fill="#ffffff"/>
  <text x="48" y="84" font-size="32" font-weight="700" fill="#1e3a5f">Transformer encoder stack  (2 of 2)</text>
  <text x="48" y="114" font-size="16" fill="#64748b">Token stream to pooled representation, with one block opened up</text>
  <rect x="48" y="128" width="648" height="224" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="64" y="154" font-size="16" font-weight="600" fill="#64748b">2. Self-attention  (pre-norm residual)</text>
  <rect x="72" y="184" width="600" height="144" rx="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g data-pptx-role="group" data-node-id="attn-g-ln1">
    <rect x="96" y="216" width="176" height="72" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="112" y="246" font-size="18" font-weight="600" fill="#374151">LayerNorm</text>
    <text x="112" y="272" font-size="16" fill="#64748b">(B, L, d)</text>
  </g>
  <g data-pptx-role="group" data-node-id="attn-g-sdp">
    <rect x="296" y="208" width="264" height="96" rx="8" fill="#f8fafc" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="312" y="238" font-size="18" font-weight="600" fill="#374151">Scaled dot-product</text>
    <text x="312" y="262" font-size="16" font-weight="400" fill="#64748b">H heads, causal mask</text>
    <text x="312" y="288" font-size="16" fill="#64748b">(B, H, L, L)</text>
  </g>
  <g data-pptx-role="group" data-node-id="attn-g-add1">
    <circle cx="616" cy="256" r="32" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="616" y="263" text-anchor="middle" font-size="18" font-weight="700" fill="#475569">+</text>
  </g>
  <rect x="48" y="376" width="608" height="224" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="64" y="402" font-size="16" font-weight="600" fill="#64748b">3. Feed-forward  (pre-norm residual)</text>
  <rect x="72" y="432" width="560" height="144" rx="8" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g data-pptx-role="group" data-node-id="ffn-g-ln2">
    <rect x="96" y="464" width="176" height="72" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="112" y="494" font-size="18" font-weight="600" fill="#374151">LayerNorm</text>
    <text x="112" y="520" font-size="16" fill="#64748b">(B, L, d)</text>
  </g>
  <g data-pptx-role="group" data-node-id="ffn-g-up">
    <rect x="296" y="456" width="224" height="96" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="312" y="486" font-size="18" font-weight="600" fill="#374151">Linear d to 4d</text>
    <text x="312" y="510" font-size="16" font-weight="400" fill="#64748b">GELU, dropout 0.1</text>
    <text x="312" y="536" font-size="16" fill="#64748b">(B, L, 4d)</text>
  </g>
  <g data-pptx-role="group" data-node-id="ffn-g-add2">
    <circle cx="576" cy="504" r="32" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="576" y="511" text-anchor="middle" font-size="18" font-weight="700" fill="#475569">+</text>
  </g>
  <defs><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="arrow-aux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs>
  <polyline points="272,252 280,252 280,256 296,256" fill="none" stroke="#475569" stroke-width="2" data-from="attn-g-ln1" data-to="attn-g-sdp" marker-end="url(#arrow-line)"/>
  <polyline points="560,256 584,256" fill="none" stroke="#475569" stroke-width="2" data-from="attn-g-sdp" data-to="attn-g-add1" marker-end="url(#arrow-line)"/>
  <polyline points="272,500 280,500 280,504 296,504" fill="none" stroke="#475569" stroke-width="2" data-from="ffn-g-ln2" data-to="ffn-g-up" marker-end="url(#arrow-line)"/>
  <polyline points="520,504 544,504" fill="none" stroke="#475569" stroke-width="2" data-from="ffn-g-up" data-to="ffn-g-add2" marker-end="url(#arrow-line)"/>
  <polyline points="184,216 184,196 616,196 616,224" fill="none" stroke="#475569" stroke-width="2" data-from="attn-g-ln1" data-to="attn-g-add1" marker-end="url(#arrow-line)"/>
  <polyline points="184,464 184,444 576,444 576,472" fill="none" stroke="#475569" stroke-width="2" data-from="ffn-g-ln2" data-to="ffn-g-add2" marker-end="url(#arrow-line)"/>
  <polyline points="616,288 616,376 184,376 184,464" fill="none" stroke="#475569" stroke-width="2" data-from="attn-g-add1" data-to="ffn-g-ln2" marker-end="url(#arrow-line)"/>
  <text x="48" y="635" font-size="16" fill="#64748b">Amber: the training-only gradient path. Arcs are residual identities. L sequence length, d model width, H heads.</text>
</svg>
